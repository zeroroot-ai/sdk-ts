name: node-ci

# Thin caller for the org's tiered Node/pnpm CI (reusable-node-ci.yml).
#
#   pull_request -> fast tier:  frozen-lockfile install, typecheck, lint
#                               (oxlint), node:test suites.
#   merge_group  -> heavy tier: `pnpm build`.
#
# Pinned to a commit SHA (never a tag, never @main) per the org's
# blast-radius rule; the tag that SHA corresponds to is kept as a
# trailing comment for readability.
#
# permissions MUST include packages: read — the reusable's job requests it
# (GitHub Packages reads, zeroroot-ai/.github#240) and a caller granting
# only contents: read fails validation as a jobless startup_failure.

on:
  pull_request:
  merge_group:

concurrency:
  group: node-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  fast:
    if: github.event_name == 'pull_request'
    uses: zeroroot-ai/.github/.github/workflows/reusable-node-ci.yml@26202a5181acc259188b0a21b0fc2e75a9f1dac3 # v0.4.1
    with:
      tier: fast

  heavy:
    if: github.event_name == 'merge_group'
    uses: zeroroot-ai/.github/.github/workflows/reusable-node-ci.yml@26202a5181acc259188b0a21b0fc2e75a9f1dac3 # v0.4.1
    with:
      tier: heavy

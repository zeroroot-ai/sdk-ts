name: release-please

# release-please opens a release PR from Conventional Commits; merging it
# creates the tag and release, and the publish job ships @zeroroot-ai/sdk to
# npm. Publishing is gated on the NPM_TOKEN secret existing — until the
# npm scope is claimed and the token added, the job warns and skips, so
# releases keep working while npm lags.
#
# GITHUB_TOKEN is deliberate: nothing here depends on a tag-triggered
# workflow — publish reacts to the action's outputs in the same run.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.SDK_FANOUT_APP_ID }}
          private-key: ${{ secrets.SDK_FANOUT_APP_PRIVATE_KEY }}
          owner: zeroroot-ai
          repositories: sdk-ts

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: publish to npm
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Gate on NPM_TOKEN
        id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::warning::A release was created but NPM_TOKEN is not configured — npm publish skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.gate.outputs.ready == 'true'

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.gate.outputs.ready == 'true'
        with:
          version: "10"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version-file: .tool-versions

      - name: Install and build
        if: steps.gate.outputs.ready == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Publish @zeroroot-ai/sdk
        if: steps.gate.outputs.ready == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"
          pnpm publish --access public --no-git-checks
